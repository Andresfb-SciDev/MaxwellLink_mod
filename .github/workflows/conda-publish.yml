name: Build & Publish to Anaconda.org

on:
  pull_request:
    paths:
      - "conda.recipe/**"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "AGENTS.md"
      - "README.md"
      - "HPC_PROFILE.json"
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "docs/source/**"
      - "media/**"
      - "tutorials/**"
      - ".github/workflows/conda-publish.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "conda.recipe/**"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "AGENTS.md"
      - "README.md"
      - "HPC_PROFILE.json"
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "docs/source/**"
      - "media/**"
      - "tutorials/**"
      - ".github/workflows/conda-publish.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package after a successful build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: conda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test Conda Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected_tag = f"v{package_version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match {expected_tag!r}"
              )
          print(f"Building MaxwellLink {package_version}")
          PY

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Build and test package
        shell: bash -el {0}
        run: |
          conda install --yes conda-build
          conda build conda.recipe --output-folder ./build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxwelllink-conda-package
          path: ./build/noarch/maxwelllink-*.conda
          if-no-files-found: error

  publish:
    name: Publish to Anaconda.org
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: maxwelllink-conda-package
          path: ./dist

      - name: Publish package
        uses: anaconda/actions/upload-package@v0
        with:
          token: ${{ secrets.ANACONDA_ORG_TOKEN }}
          channel: ${{ vars.ANACONDA_ORG_CHANNEL }}
          packages: ./dist/*.conda
